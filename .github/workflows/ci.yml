name: CI/CD Pipeline

on:
  push:
  pull_request:

jobs:

  ci:
    name: Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flake8
        run: flake8

      - name: Run tests with coverage
        env:
          SECRET_KEY: django-insecure-ci-only
          DEBUG: 'True'
        run: pytest --cov=. --cov-fail-under=80

  build-and-push:
    name: Build & Push Docker Image
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/oc-lettings:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/oc-lettings:latest \
            .
          docker push ${{ secrets.DOCKER_USERNAME }}/oc-lettings:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/oc-lettings:latest

  deploy:
    name: Deploy to Render
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Trigger Render deployment
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"