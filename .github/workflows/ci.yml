name: CI/CD Pipeline

on:
  push:
    branches: [deploy-prod, deploy-test]
  pull_request:
  workflow_dispatch:

jobs:
  ci-django:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run database migrations
        run: |
          python manage.py migrate
      - name: Run flake8
        run: |
          flake8
      - name: Run tests
        run: |
          python manage.py test
          coverage run --source='.' manage.py test
          coverage report

  build-and-push-docker-image:
    runs-on: ubuntu-latest
    needs: ci-django
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/django-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/django-app:latest

  deploy-test:
    runs-on: ubuntu-latest
    needs: build-and-push-docker-image
    if: github.ref == 'refs/heads/deploy-test'
    steps:
      - name: Pull Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker pull $DOCKER_USERNAME/django-app:latest

      - name: Run Docker container
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker run -d --name django-app-test -p 8000:8000 $DOCKER_USERNAME/django-app:latest

      - name: Wait for Docker container to be ready
        run: |
          sleep 10

      - name: Collect static files
        run: |
          docker exec django-app-test python manage.py collectstatic --noinput

      - name: Run database migrations
        run: |
          docker exec django-app-test python manage.py migrate

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build-and-push-docker-image
    if: github.ref == 'refs/heads/deploy-prod'
    steps:
      # Check-out your repository.
      - name: Checkout
        uses: actions/checkout@v2

      # Build, Push and Release a Docker container to Heroku.
      - name: Build, Push and Release a Docker container to Heroku
        uses: gonuit/heroku-docker-deploy@v1.3.3
        with:
          email: ${{ secrets.HEROKU_EMAIL }}
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          dockerfile_directory: ./
          dockerfile_name: Dockerfile
          process_type: web

      # Wait for Heroku app to be ready
      - name: Wait for Heroku app to be ready
        run: |
          sleep 20  # Pause to give time for Heroku to start the app

      # Collect static files
      - name: Collect static files
        run: |
          heroku run --app ${{ secrets.HEROKU_APP_NAME }} "python manage.py collectstatic --noinput"

      # Run database migrations
      - name: Run database migrations
        run: |
          heroku run --app ${{ secrets.HEROKU_APP_NAME }} "python manage.py migrate"